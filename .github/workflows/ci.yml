name: CI

on:
  push:
    branches: [ customizations ]
  pull_request:
    branches: [ customizations ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci
      - run: npx grunt build-styling build-code
